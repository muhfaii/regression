[project]
name = "regassist"
version = "0.1.0"
description = "Regression Assistant — local-first multivariable regression tool with diagnostics and remediation"
requires-python = "==3.12.*"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "linearmodels>=4.29",
    "openpyxl>=3.1",
    "streamlit>=1.36",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regassist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
